name: Build in COPR

on:
  push:
    tags:
      - v[0-9]+.*
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to build (e.g. v0.1.14)'
        required: true
        type: string

jobs:
  publish-copr:
    name: Build in COPR
    runs-on: ubuntu-latest
    steps:
      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install copr-cli
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          pip3 install copr-cli

      # COPR_TOKEN holds the whole config block as downloaded from
      # https://copr.fedorainfracloud.org/api/ -- [copr-cli] header, login,
      # username, token and copr_url -- not just the token field. It is written
      # verbatim; assembling a config around it produced a duplicate `login` key.
      - name: Configure copr-cli
        env:
          COPR_CONFIG: ${{ secrets.COPR_TOKEN }}
        run: |
          if [ -z "$COPR_CONFIG" ]; then
            echo "::error::the COPR_TOKEN secret is empty"
            exit 1
          fi
          mkdir -p ~/.config
          printf '%s\n' "$COPR_CONFIG" > ~/.config/copr
          chmod 600 ~/.config/copr

      - name: Submit COPR build
        run: |
          # Submit build using spec file URL - COPR downloads sources and builds with network
          SPEC_URL="https://raw.githubusercontent.com/tmshlvck/teleddns/${{ steps.tag.outputs.tag }}/teleddns.spec"
          # No -r flags on purpose: the build goes to whichever chroots are enabled
          # on the COPR project, so adding or dropping a Fedora release or an
          # architecture is a project setting and needs no change here.
          #
          # The remaining constraint that does live in this repo is ExclusiveArch in
          # teleddns.spec (x86_64, aarch64, riscv64). Fedora has no 32-bit ARM
          # chroot, so there is never an armv7hf RPM; armhf is served by the .deb
          # and by the static binary from the release.
          copr-cli build tmshlvck/teleddns --nowait "$SPEC_URL"
