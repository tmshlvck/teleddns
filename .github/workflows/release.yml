name: Release

on:
  push:
    tags:
      - v[0-9]+.*

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

# Artifacts come in two flavours, deliberately:
#
#   * GitHub release binaries are statically linked musl, so they run on any
#     distribution regardless of its glibc.
#   * .deb packages are built inside a container of the suite they are published
#     to, so each one is linked against that suite's glibc and carries correct
#     dependency metadata.
#
# .rpm packages are built natively by COPR, see .github/workflows/copr.yml.

jobs:
  check-version:
    name: Check tag matches Cargo.toml
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Compare tag against the crate version
        id: version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          crate_version="$(cargo pkgid | sed 's/.*[#@]//')"
          if [ "$tag_version" != "$crate_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $crate_version"
            exit 1
          fi
          echo "version=$tag_version" >> "$GITHUB_OUTPUT"

  # Last, and only once everything else has built: publishing to crates.io cannot
  # be undone, so a failure anywhere else must not leave a version stranded there.
  publish-sources:
    name: Publish sources to crates.io
    needs: [build-binaries, build-debs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        env:
          # Passed in the environment rather than on the command line, where the
          # token would show up in a process listing.
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::the CARGO_REGISTRY_TOKEN secret is not set"
            exit 1
          fi
          cargo publish --locked

  # Portable static binaries for the GitHub release, built with cargo-zigbuild.
  #
  # `zig cc` supplies the cross C toolchain and the musl sources, so every target
  # links a fully static binary that runs on any distribution regardless of libc,
  # riscv64 included. No container and no per-target image to rot; the only
  # moving parts are the pinned zig and cargo-zigbuild versions below.
  #
  # (We used cross before. Its last release is from 2023 and those images no
  # longer build against current rustc; the maintainer's advice is to track the
  # unreleased `:main` images. zigbuild ships real releases and needs no Docker.)
  build-binaries:
    name: Build static binary (${{ matrix.arch }})
    needs: check-version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64
          - target: aarch64-unknown-linux-musl
            arch: arm64
          - target: armv7-unknown-linux-musleabihf
            arch: armhf
          - target: arm-unknown-linux-musleabi
            arch: armel
          - target: riscv64gc-unknown-linux-musl
            arch: riscv64
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@0.23.4

      # Registers binfmt handlers so the foreign-architecture binary can be
      # executed directly in the smoke test below.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Build
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}

      - name: Check the binary has no shared-library dependencies
        run: |
          bin="target/${{ matrix.target }}/release/teleddns"
          file "$bin"
          # A static binary has either no dynamic section (arm*, aarch64) or a
          # static-pie one with no NEEDED entries (x86_64, riscv64). Either way,
          # a NEEDED entry means it would need a shared library at runtime.
          if readelf -d "$bin" 2>/dev/null | grep -q 'NEEDED'; then
            echo "::error::$bin has shared-library dependencies, expected a static binary"
            readelf -d "$bin"
            exit 1
          fi

      - name: Smoke test under QEMU
        run: ./target/${{ matrix.target }}/release/teleddns --version

      - name: Package tarball
        run: |
          tar -czf "teleddns-${{ matrix.target }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" teleddns

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.arch }}
          path: teleddns-${{ matrix.target }}.tar.gz

  # One .deb per suite per architecture, each built against its own suite's glibc.
  #
  # armel (ARMv5 soft-float ABI, runs on the original Raspberry Pi 1 / Zero) is
  # Debian only: Ubuntu has never had an armel port, so it is added for trixie
  # alone via the include block below rather than in the suite x arch product.
  build-debs:
    name: Build .deb (${{ matrix.suite }}/${{ matrix.arch }})
    needs: check-version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [trixie, noble, resolute]
        arch: [amd64, arm64, armhf, riscv64]
        include:
          - suite: trixie
            image: debian:trixie
          - suite: noble
            image: ubuntu:noble
          - suite: resolute
            image: ubuntu:resolute
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64
          - arch: armhf
            platform: linux/arm/v7
          - arch: riscv64
            platform: linux/riscv64
          # Standalone combination: fully specified so it is not folded into any
          # suite/arch pair above.
          - suite: trixie
            arch: armel
            image: debian:trixie
            platform: linux/arm/v5
    steps:
      - uses: actions/checkout@v7

      # Needed to run the built package under the target architecture below.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Build .deb in a ${{ matrix.suite }} container
        run: |
          docker run --rm -v "$PWD:/work" -w /work ${{ matrix.image }} \
            ./ci/build-deb.sh ${{ matrix.arch }} \
            "${{ needs.check-version.outputs.version }}~${{ matrix.suite }}1"

      - name: Install the package and run it
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -v "$PWD/dist:/dist" -w /dist ${{ matrix.image }} \
            sh -c 'apt-get update -qq && apt-get install -y ./*.deb && teleddns --version'

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.suite }}-${{ matrix.arch }}
          path: dist/*.deb

  github-release:
    name: Create GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            teleddns-*.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-apt:
    name: Publish to APT repo
    needs: build-debs
    runs-on: ubuntu-latest
    steps:
      - name: Download .deb artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: deb-*
          merge-multiple: true

      - name: Upload and publish to APT repo
        env:
          SSH_KEY: ${{ secrets.APT_SSH_KEY }}
          SSH_HOST: ${{ secrets.APT_SSH_HOST }}
          SSH_USER: ${{ secrets.APT_SSH_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan "$SSH_HOST" >> ~/.ssh/known_hosts

          # Each package goes to the one suite it was built for; the suite is
          # encoded in the version as <version>~<suite>1.
          for deb in *.deb; do
            suite="$(echo "$deb" | sed -n 's/.*~\([a-z][a-z]*\)[0-9]*_.*/\1/p')"
            if [ -z "$suite" ]; then
              echo "::error::cannot determine suite from $deb"
              exit 1
            fi
            echo "Publishing $deb to $suite..."
            scp "$deb" "${SSH_USER}@${SSH_HOST}:/tmp/"
            ssh "${SSH_USER}@${SSH_HOST}" \
              "cd /srv/apt/www/teleddns && reprepro includedeb $suite /tmp/$deb && rm /tmp/$deb"
          done
