name: Release

on:
  push:
    tags:
      - v[0-9]+.*

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

# Everything is cross-built on the runner with cargo-zigbuild, no containers:
#
#   * GitHub release tarballs: static musl binaries, run on any distribution.
#   * .deb packages: glibc binaries linked against glibc 2.36 symbol versions, so
#     one package per architecture runs on every suite we publish (and on any
#     newer glibc). Depends is a fixed `libc6 (>= ...)` in Cargo.toml, checked
#     against the binary below.
#
# .rpm packages are built natively by COPR, see .github/workflows/copr.yml.

jobs:
  check-version:
    name: Check tag matches Cargo.toml
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Compare tag against the crate version
        id: version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          crate_version="$(cargo pkgid | sed 's/.*[#@]//')"
          if [ "$tag_version" != "$crate_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $crate_version"
            exit 1
          fi
          echo "version=$tag_version" >> "$GITHUB_OUTPUT"

  # Last, and only once everything else has built: publishing to crates.io cannot
  # be undone, so a failure anywhere else must not leave a version stranded there.
  publish-sources:
    name: Publish sources to crates.io
    needs: [build-binaries, test-debs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        env:
          # Passed in the environment rather than on the command line, where the
          # token would show up in a process listing.
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::the CARGO_REGISTRY_TOKEN secret is not set"
            exit 1
          fi
          cargo publish --locked

  # Both kinds of binary are built with cargo-zigbuild: `zig cc` supplies the
  # cross C toolchain, musl and glibc stubs for any target and glibc version. No
  # container and no per-target image to rot; the only moving parts are the
  # pinned zig, cargo-zigbuild and cargo-deb versions below.
  #
  # (We used cross before. Its last release is from 2023 and those images no
  # longer build against current rustc. zigbuild ships real releases.)
  #
  # armhf .debs are built for ARMv6 + VFP (arm-unknown-linux-gnueabihf), the
  # baseline of Raspberry Pi OS, so they also run on the Raspberry Pi 1 / Zero.
  build-binaries:
    name: Build (${{ matrix.arch }})
    needs: check-version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            musl: x86_64-unknown-linux-musl
            gnu: x86_64-unknown-linux-gnu
          - arch: arm64
            musl: aarch64-unknown-linux-musl
            gnu: aarch64-unknown-linux-gnu
          - arch: armhf
            musl: armv7-unknown-linux-musleabihf
            gnu: arm-unknown-linux-gnueabihf
          - arch: armel
            musl: arm-unknown-linux-musleabi
            gnu: arm-unknown-linux-gnueabi
          - arch: riscv64
            musl: riscv64gc-unknown-linux-musl
            gnu: riscv64gc-unknown-linux-gnu
    env:
      # The oldest glibc whose symbol versions the .deb binary may use.
      GLIBC: "2.36"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.musl }},${{ matrix.gnu }}

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Install cargo-zigbuild and cargo-deb
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@0.23.4,cargo-deb@3.8.0

      # Registers binfmt handlers so the foreign-architecture binary can be
      # executed directly in the smoke test below.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build
        run: |
          cargo zigbuild --release --locked --target ${{ matrix.musl }}
          cargo zigbuild --release --locked --target ${{ matrix.gnu }}.$GLIBC

      - name: Check the musl binary has no shared-library dependencies
        run: |
          bin="target/${{ matrix.musl }}/release/teleddns"
          file "$bin"
          # A static binary has either no dynamic section (arm*, aarch64) or a
          # static-pie one with no NEEDED entries (x86_64, riscv64). Either way,
          # a NEEDED entry means it would need a shared library at runtime.
          if readelf -d "$bin" 2>/dev/null | grep -q 'NEEDED'; then
            echo "::error::$bin has shared-library dependencies, expected a static binary"
            readelf -d "$bin"
            exit 1
          fi

      # The .deb declares a fixed Depends; make sure the binary needs nothing more.
      - name: Check the glibc binary against the declared Depends
        run: |
          bin="target/${{ matrix.gnu }}/release/teleddns"
          file "$bin"
          extra="$(readelf -d "$bin" | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p' \
                   | grep -vx -e 'libc.so.6' -e 'libm.so.6' -e 'ld-linux.*' || true)"
          if [ -n "$extra" ]; then
            echo "::error::$bin needs libraries outside libc6: $extra"
            exit 1
          fi
          needs="$(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -n1)"
          declared="$(sed -n 's/^depends = "libc6 (>= \([0-9.]*\))"$/\1/p' Cargo.toml)"
          echo "binary needs glibc $needs, Cargo.toml declares libc6 (>= $declared)"
          if [ -z "$declared" ] || [ "$(printf '%s\n' "$needs" "$declared" | sort -V | tail -n1)" != "$declared" ]; then
            echo "::error::the binary needs glibc $needs, raise the libc6 dependency in Cargo.toml"
            exit 1
          fi

      - name: Smoke test under QEMU
        run: ./target/${{ matrix.musl }}/release/teleddns --version

      - name: Package tarball and .deb
        run: |
          tar -czf "teleddns-${{ matrix.musl }}.tar.gz" \
            -C "target/${{ matrix.musl }}/release" teleddns
          cargo deb --no-build --no-strip --target ${{ matrix.gnu }} --output dist/

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.arch }}
          path: teleddns-${{ matrix.musl }}.tar.gz

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: dist/*.deb

  # Install and run each architecture's .deb in every suite it is published to,
  # under QEMU. The suites are the Codenames of the APT repo (teleinfra
  # ansible/files/slon.telephant.eu/reprepro/teleddns/distributions). armel is
  # Debian only: Ubuntu has never had an armel port.
  test-debs:
    name: Test .deb (${{ matrix.suite }}/${{ matrix.arch }})
    needs: build-binaries
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [trixie, noble, resolute]
        arch: [amd64, arm64, armhf, riscv64]
        include:
          - suite: trixie
            image: debian:trixie
          - suite: noble
            image: ubuntu:noble
          - suite: resolute
            image: ubuntu:resolute
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64
          - arch: armhf
            platform: linux/arm/v7
          - arch: riscv64
            platform: linux/riscv64
          # Standalone combination: fully specified so it is not folded into any
          # suite/arch pair above.
          - suite: trixie
            arch: armel
            image: debian:trixie
            platform: linux/arm/v5
    steps:
      - name: Download the ${{ matrix.arch }} .deb
        uses: actions/download-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: dist

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Install the package and run it
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -v "$PWD/dist:/dist" -w /dist ${{ matrix.image }} \
            sh -c 'apt-get update -qq && apt-get install -y ./*.deb && teleddns --version'

  github-release:
    name: Create GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          merge-multiple: true

      # deploy.sh verifies its download against this.
      - name: Checksums
        run: sha256sum teleddns-*.tar.gz > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            teleddns-*.tar.gz
            SHA256SUMS
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-apt:
    name: Publish to APT repo
    needs: test-debs
    runs-on: ubuntu-latest
    steps:
      - name: Download .deb artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          merge-multiple: true

      # The key may only run /usr/local/bin/apt-publish teleddns on slon (teleinfra
      # ansible/slon-reprepro.yml). It takes a tar of .debs on stdin and puts each
      # one into every suite that lists its architecture. No shell, no scp.
      - name: Upload and publish to APT repo
        env:
          SSH_KEY: ${{ secrets.APT_SSH_KEY }}
          SSH_HOST: ${{ secrets.APT_SSH_HOST }}
          SSH_USER: ${{ secrets.APT_SSH_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ls -l *.deb
          # The runner is fresh, so the host key is accepted on first contact.
          tar -cf - *.deb | ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new "${SSH_USER}@${SSH_HOST}"
